name: Writing lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".github/styles/**"
      - ".github/workflows/writing-lint.yml"

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.17.1
          files: '["AGENTS.md", "README.md", "docs"]'
          sync: false
          fail_on_error: true
          filter_mode: added
